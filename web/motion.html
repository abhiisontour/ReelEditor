        const L=side(S.left||{},70,col(cs[0]),0), R=side(S.right||{},500,col(cs[1]||cs[0]),1); const vs=el('div','a big gt',{left:'420px',width:'160px',top:'540px',fontSize:'90px',backgroundImage:grad(cs)},'vs'); root.appendChild(vs);
        up=t=>{ pop(L,t,T((S.left||{}).at)??t0+0.2,0.34,30); pop(R,t,T((S.right||{}).at)??t0+0.6,0.34,30); st(vs,t,t0+0.4,0.3,10); };
      }
      else if(S.type==='title_card'){ const e=el('div','a big gt',{left:'60px',width:'880px',top:'700px',fontSize:(S.px||200)+'px',backgroundImage:grad(cs)},S.text||''); const sb=el('div','a hk',{left:'0',width:'1000px',top:'960px',fontSize:'48px'},S.sub||'');
        root.append(e,sb); requestAnimationFrame(()=>fitW(e)); up=t=>{ enter(e,t,t0+0.15,0.35,40,0.94); st(sb,t,t0+0.45); };
      }
      else { root.remove(); continue; }
      updaters.push(t=>{ const hard=S.pip===false, end2=hard?t1:t1+0.35, vis=t>=(hard?t0:t0-0.1)&&t<end2; root.style.opacity=vis?(hard?1:clamp((end2-t)/0.35)):0; if(vis) up(t); });
      continue;
    }
    else { root.remove(); continue; }
    updaters.push(t=>{ const vis=t>=t0-0.2&&t<end; root.style.opacity=vis?clamp((end-t)/OUT):0; if(vis) up(t); });
  }
  window.renderFrame=n=>{ const t=n/FPS; updaters.forEach(u=>u(t)); };

});
