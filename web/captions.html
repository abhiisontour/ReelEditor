<!doctype html><html><head><meta charset="utf-8">
<!-- reelkit caption layer. ?p=/abs/project  reads work/captions_render.json -->
<style>
@font-face{font-family:IS;font-style:italic;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#cap{position:absolute;left:140px;width:800px;text-align:center}
.line{display:block;white-space:nowrap}
.sm{font-family:Inter;font-weight:600;font-size:58px;line-height:1.15;color:#F5F5F4;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.key{font-family:IS;font-style:italic;font-size:210px;line-height:1.0;letter-spacing:-.01em;filter:drop-shadow(0 4px 22px rgba(0,0,0,.5))}
.key .w{padding:0 .1em;-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block}
</style></head><body><div id="cap"></div>
<script>
const P=new URLSearchParams(location.search).get('p'), FPS=30, ZT=1180, ZB=1540, CY=1360, PAD=36;
const ease=t=>1-Math.pow(1-Math.min(Math.max(t,0),1),3);
fetch(P+'/work/captions_render.json').then(r=>r.json()).then(R=>{
  const CH=R.chunks, cap=document.getElementById('cap'); let built=-1, els=[];
  if(R.style&&R.style.small_px) document.styleSheets[0].insertRule(`.sm{font-size:${R.style.small_px}px}`, 99);
  function build(k){ const c=CH[k]; cap.innerHTML=''; els=[];
    const ki=c.words.findIndex(w=>w.key);
    const groups= ki<0?[[c.words,'sm']]:[[c.words.slice(0,ki),'sm'],[[c.words[ki]],'key'],[c.words.slice(ki+1),'sm']];
    for(const [ws,cls] of groups){ if(!ws.length) continue; const line=document.createElement('div'); line.className='line '+cls;
      ws.forEach((w,j)=>{const s=document.createElement('span'); s.className='w'; s.textContent=w.text; s.dataset.t=w.t; s.dataset.key=cls==='key'?1:0;
        if(cls==='key'){ if(c.hide_key) s.dataset.hidden=1; s.style.backgroundImage=`linear-gradient(90deg,${(c.grad||['#FF8A5B','#F472B6']).join(',')})`; }
        line.appendChild(s); if(j<ws.length-1) line.appendChild(document.createTextNode(' ')); els.push(s);});
      cap.appendChild(line);
      if(cls==='key'){let fs=210; while(line.scrollWidth>800&&fs>120){fs-=6; line.style.fontSize=fs+'px';}} }
    const h=cap.offsetHeight; let top=Math.max(CY-h/2,c.face_bottom+PAD,ZT); top=Math.min(top,ZB-h); cap.style.top=top+'px'; built=k; }
  window.renderFrame=n=>{ const t=n/FPS, k=CH.findIndex(c=>t>=c.t0&&t<c.t1);
    if(k<0||CH[k].hide){cap.style.visibility='hidden';return;} cap.style.visibility='visible'; if(k!==built) build(k);
    for(const s of els){ const key=s.dataset.key==='1', d=key?0.3:0.22, p=ease((t-(+s.dataset.t))/d);
      s.style.opacity=(t<+s.dataset.t||s.dataset.hidden)?0:p;
      s.style.transform=key?`translateY(${(1-p)*22}px) scale(${0.9+0.1*p})`:`translateY(${(1-p)*14}px)`; s.style.filter=key?'':`blur(${(1-p)*5}px)`; } };
  document.fonts.ready.then(()=>window.ready=true);
});
</script></body></html>
